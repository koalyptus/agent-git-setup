name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        # Run the whole step in a single pwsh -Command invocation: GitHub
        # Actions 'shell: pwsh' dot-sources the run-script, which traps
        # imported cmdlets in the script scope. Calling pwsh -NoProfile
        # -Command directly gives us a fresh session where PSScriptAnalyzer
        # auto-loads from PSModulePath on first use.
        run: |
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            # Ensure PSScriptAnalyzer is installed. The Ubuntu runner ships
            # 1.25.0 globally under /usr/local/share/powershell/Modules, but
            # PSModulePath in a fresh pwsh session may not include it.
            if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AcceptLicense
            }
            $env:PSModulePath = "/usr/local/share/powershell/Modules:" + $env:PSModulePath
            Import-Module -Name PSScriptAnalyzer -ErrorAction Stop
            if (-not (Get-Command -Name Invoke-PSScriptAnalyzer -ErrorAction SilentlyContinue)) {
              Write-Error "Invoke-PSScriptAnalyzer not exported after Import-Module"
              exit 1
            }
            $result = Invoke-PSScriptAnalyzer -Path scripts/agent-git-setup.ps1 tests/agent-git-setup-test.ps1
            if ($null -ne $result) { $result | Format-Table -AutoSize }
            if ($null -ne $result -and $result.Count -gt 0) { exit 1 }
          '
