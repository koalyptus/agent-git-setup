name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # GitHub-hosted Ubuntu runners ship PSScriptAnalyzer 1.25.0 under
          # /usr/local/share/powershell/Modules. Use whatever the highest
          # available version is, but always install the latest into
          # CurrentUser scope as a fallback. Import by manifest path with
          # -Global so the cmdlet is visible to the rest of the step.
          $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
          if ($null -eq $installed) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AcceptLicense
            $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
          }
          if ($null -eq $installed) { Write-Error "PSScriptAnalyzer not found"; exit 1 }
          Write-Host "Using PSScriptAnalyzer $($installed.Version) at $($installed.Path)"
          Import-Module -Name $installed.Path -Force -Global
          if (-not (Get-Command -Name Invoke-PSScriptAnalyzer -ErrorAction SilentlyContinue)) {
            Write-Error "Invoke-PSScriptAnalyzer not exported after Import-Module"
            exit 1
          }
          $result = Invoke-PSScriptAnalyzer -Path scripts/agent-git-setup.ps1 tests/agent-git-setup-test.ps1
          if ($null -ne $result) { $result | Format-Table -AutoSize }
          if ($null -ne $result -and $result.Count -gt 0) { exit 1 }
