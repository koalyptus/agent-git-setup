name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        # The Ubuntu runner ships PSScriptAnalyzer 1.25.0 globally. The
        # exported cmdlet in 1.25.0 is Invoke-ScriptAnalyzer (older
        # versions used Invoke-PSScriptAnalyzer). We try the new name
        # first and fall back to the old name so this works regardless
        # of which version is on the runner.
        run: |
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
            if ($null -eq $installed) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AcceptLicense
              $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
            }
            if ($null -eq $installed) { Write-Error "PSScriptAnalyzer not found"; exit 1 }
            Write-Host "Using PSScriptAnalyzer $($installed.Version) at $($installed.Path)"
            Import-Module -Name $installed.Path -Force
            $invoke = @("Invoke-ScriptAnalyzer", "Invoke-PSScriptAnalyzer") |
              Where-Object { Get-Command -Name $_ -ErrorAction SilentlyContinue } |
              Select-Object -First 1
            if ($null -eq $invoke) { Write-Error "Neither Invoke-ScriptAnalyzer nor Invoke-PSScriptAnalyzer exported"; exit 1 }
            Write-Host "Using cmdlet: $invoke"
            $result = & $invoke -Path scripts/agent-git-setup.ps1 tests/agent-git-setup-test.ps1
            if ($null -ne $result) { $result | Format-Table -AutoSize }
            if ($null -ne $result -and @($result).Count -gt 0) { exit 1 }
          '
