name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          $psaRoot = Join-Path -Path ([Environment]::GetFolderPath('LocalApplicationData')) -ChildPath 'PowerShell/Modules/PSScriptAnalyzer'
          $psaPath = Get-ChildItem -Path $psaRoot -Recurse -Filter 'PSScriptAnalyzer.psd1' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $psaPath) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AcceptLicense
            $psaPath = Get-ChildItem -Path $psaRoot -Recurse -Filter 'PSScriptAnalyzer.psd1' | Select-Object -First 1
          }
          if ($null -eq $psaPath) { Write-Error "PSScriptAnalyzer not found at $psaRoot"; exit 1 }
          Write-Host "Using PSScriptAnalyzer at: $($psaPath.FullName)"
          Import-Module -Name $psaPath.FullName -Force -ErrorAction Stop
          $result = Invoke-PSScriptAnalyzer -Path scripts/agent-git-setup.ps1 tests/agent-git-setup-test.ps1
          if ($null -ne $result) { $result | Format-Table -AutoSize }
          if ($null -ne $result -and $result.Count -gt 0) { exit 1 }
