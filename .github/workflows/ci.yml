name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify skill bundle matches source-of-truth scripts
        run: make sync-check

  test:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests
        run: bash tests/agent-git-setup-test.sh
      - name: Run mint-token tests
        run: bash tests/mint-token-test.sh

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -sS https://webi.sh/shfmt | sh
      - name: Run shellcheck
        run: shellcheck scripts/agent-git-setup.sh scripts/mint-token.sh skills/agent-git-setup/scripts/agent-git-setup.sh skills/agent-git-setup/scripts/mint-token.sh tests/agent-git-setup-test.sh tests/mint-token-test.sh
      - name: Run shfmt
        run: shfmt -d scripts/agent-git-setup.sh scripts/mint-token.sh skills/agent-git-setup/scripts/agent-git-setup.sh skills/agent-git-setup/scripts/mint-token.sh tests/agent-git-setup-test.sh tests/mint-token-test.sh
