name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hermetic tests
        run: bash tests/agent-git-setup-test.sh
      - name: Run mint-token tests
        run: bash tests/mint-token-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + shfmt
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -sS https://webi.sh/shfmt | sh
      - name: Run shellcheck
        run: shellcheck scripts/agent-git-setup.sh scripts/mint-token.sh tests/agent-git-setup-test.sh tests/mint-token-test.sh
      - name: Run shfmt
        run: shfmt -d scripts/agent-git-setup.sh scripts/mint-token.sh tests/agent-git-setup-test.sh tests/mint-token-test.sh
