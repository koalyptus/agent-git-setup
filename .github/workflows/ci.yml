name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        run: |
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Continue"
            Write-Host "=== DEBUG: PSModulePath ==="
            Write-Host $env:PSModulePath
            Write-Host "=== DEBUG: Get-Module PSScriptAnalyzer ==="
            Get-Module -ListAvailable -Name PSScriptAnalyzer | Format-List Name, Version, Path
            Write-Host "=== DEBUG: /usr/local/share/powershell/Modules ==="
            Get-ChildItem -Path /usr/local/share/powershell/Modules -Recurse -Filter *.psd1 | Format-List FullName
            Write-Host "=== DEBUG: explicit Import-Module by path ==="
            Import-Module -Name /usr/local/share/powershell/Modules/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1 -Force -Verbose
            Write-Host "=== DEBUG: Get-Command after Import ==="
            Get-Command -Name Invoke-PSScriptAnalyzer -ErrorAction SilentlyContinue | Format-List Name, ModuleName, CommandType
            Write-Host "=== DEBUG: module loaded? ==="
            Get-Module -Name PSScriptAnalyzer | Format-List Name, Version
          '
