name: CI
on: [push, pull_request]

# Least-privilege: these jobs only read the repo and run local checks.
permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check skill-scripts sync
        run: make sync-check

  test-linux:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (bash)
        run: make test

  test-windows:
    needs: sync-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hermetic tests (PowerShell)
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          pwsh tests/agent-git-setup-test.ps1

  lint:
    needs: sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck + shfmt
        run: make install
      - name: Run shellcheck + shfmt (bash scripts)
        run: make lint-bash
      - name: Install PSScriptAnalyzer + lint PowerShell scripts
        shell: pwsh
        run: |
          Set-StrictMode -Version latest
          $ErrorActionPreference = "Stop"
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction SilentlyContinue
          $result = Invoke-PSScriptAnalyzer -Path scripts/agent-git-setup.ps1 tests/agent-git-setup-test.ps1 -ErrorAction SilentlyContinue
          if ($null -ne $result) { $result | Format-Table -AutoSize }
          if ($null -ne $result -and $result.Count -gt 0) { exit 1 }
